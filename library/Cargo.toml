[package]
name = "yaml_lib"
version = "0.2.0"
edition = "2024"
description = "YAML library implementation."
repository = "https://github.com/clockworkengineer/yaml"
license = "MIT"

[features]
default = ["std", "alloc", "stringify", "format-converters", "file-io", "validation"]
std = ["alloc"]
alloc = []
embedded = []
parse-only = []
stringify = ["alloc"]
format-converters = ["stringify"]
file-io = ["std"]
debug-trace = []
debug-anchors = []
validation = ["dep:regex", "alloc"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
log = "0.4.28"
rand = { version = "0.10.0", optional = true }
regex = { version = "1.12.2", optional = true }

[dev-dependencies]
rand = "0.10.0"
