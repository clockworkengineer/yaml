[package]
name = "yaml_lib"
version = "0.1.7"
edition = "2024"
description = "YAML library implementation."
license = "MIT"
repository = "https://github.com/clockworkengineer/yaml_lib"

[features]
default = ["std", "alloc", "stringify", "format-converters", "file-io"]
std = ["alloc"]
alloc = []
embedded = []
parse-only = []
stringify = ["alloc"]
format-converters = ["stringify"]
file-io = ["std"]
debug-trace = []
debug-anchors = []

[dependencies]
base64 = "0.22.1"
log = "0.4.28"
rand = { version = "0.9.2", optional = true }
regex = "1.12.2"

[dev-dependencies]
rand = "0.9.2"
