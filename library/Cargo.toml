[package]
name = "yaml_lib"
version = "0.1.6"
edition = "2024"
description = "YAML library implementation."
license = "MIT"

[features]
default = ["std", "alloc", "stringify", "format-converters", "file-io"]
std = ["alloc"]
alloc = []
embedded = []
parse-only = []
stringify = ["alloc"]
format-converters = ["stringify"]
file-io = ["std"]

[dependencies]
rand = { version = "0.9.2", optional = true }

[dev-dependencies]
rand = "0.9.2"